<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root { color-scheme: light; } body { margin: 0; } [hidden] { display: none !important; }</style>
<title>リクエストの旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* 構成: 上に操作、中央に 4 つの拠点とボール(往路は上の線、復路は下の線)、下に「いまの場所の説明とコード」と全ステップの一覧 */
  :root {
    --bg: #f3f5fa;
    --surface: #ffffff;
    --surface-2: #eef1f8;
    --line: #d3d9e8;
    --fg: #141a2c;
    --muted: #586179;
    --req: #2563eb;
    --res: #0c8a60;
    --req-glow: rgba(37, 99, 235, 0.28);
    --res-glow: rgba(12, 138, 96, 0.28);
    --c-browser: #0c8a60;
    --c-edge: #2563eb;
    --c-api: #a8680c;
    --c-db: #d03e28;
    --ball: #f5a30a;
    --code-bg: #f7f8fc;
    --hl: rgba(245, 163, 10, 0.18);
    --btn: #e4e8f3;
    --btn-on: #141a2c;
    --btn-on-fg: #ffffff;
    --font-body: 'IBM Plex Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0c13;
      --surface: #111522;
      --surface-2: #171c2c;
      --line: #262c40;
      --fg: #e7eaf5;
      --muted: #8d95ad;
      --req: #5b9cff;
      --res: #34d399;
      --req-glow: rgba(91, 156, 255, 0.35);
      --res-glow: rgba(52, 211, 153, 0.35);
      --c-browser: #34d399;
      --c-edge: #6aa5ff;
      --c-api: #f2b441;
      --c-db: #f4745c;
      --ball: #ffd84a;
      --code-bg: #0c0f1a;
      --hl: rgba(255, 216, 74, 0.14);
      --btn: #1b2133;
      --btn-on: #e7eaf5;
      --btn-on-fg: #0a0c13;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0c13;
    --surface: #111522;
    --surface-2: #171c2c;
    --line: #262c40;
    --fg: #e7eaf5;
    --muted: #8d95ad;
    --req: #5b9cff;
    --res: #34d399;
    --req-glow: rgba(91, 156, 255, 0.35);
    --res-glow: rgba(52, 211, 153, 0.35);
    --c-browser: #34d399;
    --c-edge: #6aa5ff;
    --c-api: #f2b441;
    --c-db: #f4745c;
    --ball: #ffd84a;
    --code-bg: #0c0f1a;
    --hl: rgba(255, 216, 74, 0.14);
    --btn: #1b2133;
    --btn-on: #e7eaf5;
    --btn-on-fg: #0a0c13;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.7;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .wrap > * { min-width: 0; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
  .back { display: inline-flex; align-items: center; min-height: 36px; margin-bottom: 6px; color: var(--muted); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--fg); text-decoration: underline; }
  .backmsg { margin: 0 0 8px; font-size: 13px; color: var(--c-api); }
  .lead { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
  code { font-family: var(--font-mono); font-size: 0.88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--req); outline-offset: 2px; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .group > .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .chipbtn, .seg button, .tp button, .tp select {
    background: var(--btn); border: 1px solid transparent; border-radius: 8px;
    min-height: 36px; padding: 4px 12px; font-size: 14px;
  }
  .chipbtn[aria-selected="true"], .seg button[aria-pressed="true"] {
    background: var(--btn-on); color: var(--btn-on-fg); font-weight: 500;
  }
  .tp button:hover, .chipbtn:hover, .seg button:hover { border-color: var(--muted); }
  .tp .primary { background: var(--btn-on); color: var(--btn-on-fg); font-weight: 500; min-width: 96px; }
  .tp select { padding-right: 6px; }

  /* 図 */
  .scroller { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .board { position: relative; min-width: 760px; aspect-ratio: 810 / 330; --move: 800ms; }
  .board > svg.lanes { position: absolute; inset: 0; width: 100%; height: 100%; }
  .station {
    position: absolute; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
    display: flex; flex-direction: column; align-items: center; padding-top: 9px;
    transition: border-color 0.3s, box-shadow 0.3s; text-align: center;
  }
  .station::before, .station::after { content: ""; position: absolute; left: 10px; right: 10px; border-top: 1px dashed var(--line); }
  .station::before { top: 34.78%; }
  .station::after { top: 78.26%; }
  .station.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 24px -8px var(--c); }
  .station .icon { width: 28px; height: 28px; stroke: var(--c); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .station .name { font-weight: 700; font-size: 14.5px; line-height: 1.3; margin-top: 1px; }
  .station .role { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .station .file { position: absolute; bottom: 8px; font: 500 10.5px var(--font-mono); color: var(--muted); }
  .glabel { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .glabel.q { color: var(--req); }
  .glabel.r { color: var(--res); }

  .ball {
    position: absolute; z-index: 3; width: 18px; height: 18px; border-radius: 50%; background: var(--ball);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 4px var(--glow), 0 0 18px 2px var(--glow);
    transition: left var(--move) cubic-bezier(0.5, 0, 0.2, 1), top var(--move) cubic-bezier(0.5, 0, 0.2, 1), box-shadow 0.3s;
  }
  .ball.req { --glow: var(--req-glow); }
  .ball.res { --glow: var(--res-glow); }

  .chip {
    position: absolute; top: 6px; z-index: 4; max-width: min(360px, 92%);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
    font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px -6px rgba(0, 0, 0, 0.35);
    transition: left var(--move) cubic-bezier(0.5, 0, 0.2, 1);
  }
  .chip::after {
    content: ""; position: absolute; left: var(--ax, 20px); bottom: -5px; width: 8px; height: 8px;
    background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    transform: translateX(-50%) rotate(45deg);
  }
  .chip .f { font: 500 12px var(--font-mono); color: var(--c-api); margin-right: 6px; }
  .chip .t { font-weight: 500; }
  .chip .m { display: block; font: 11px var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .scrub { display: flex; gap: 12px; align-items: center; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--ball); height: 28px; }
  .scrub .count { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 下半分 */
  .lower { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .eyebrow { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
  .detail h2 { margin: 0; font-size: 19px; line-height: 1.4; text-wrap: balance; }
  .detail p { margin: 0; max-width: 62ch; }
  .where { font: 500 12.5px var(--font-mono); color: var(--c-api); overflow-wrap: anywhere; }
  .code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; padding: 8px 0; font: 12.5px/1.65 var(--font-mono); }
  .code .row { display: flex; white-space: pre; width: max-content; min-width: 100%; padding-right: 12px; }
  .code .ln { color: var(--muted); width: 3.4em; text-align: right; padding-right: 14px; flex: none; user-select: none; font-variant-numeric: tabular-nums; }
  .code .row.hl { background: var(--hl); box-shadow: inset 3px 0 0 var(--ball); }
  .code .sep { color: var(--muted); padding-left: 3.4em; user-select: none; }
  .msg { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
  .msg .k { font-size: 12px; color: var(--muted); }
  .msg .v { font: 500 12.5px var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
  .msg .v.req { color: var(--req); }
  .msg .v.res { color: var(--res); }

  .stepsbox { min-width: 0; }
  .stepsbox h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
  .steps { position: relative; list-style: none; margin: 0; padding: 0; max-height: 440px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .steps li + li { border-top: 1px solid var(--line); }
  .steps button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 12px; font-size: 13.5px; line-height: 1.5; }
  .steps button:hover { background: var(--surface-2); }
  .steps li.on button { background: var(--surface-2); font-weight: 500; box-shadow: inset 3px 0 0 var(--c); }
  .steps .n { font: 12px var(--font-mono); color: var(--muted); width: 1.8em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .steps .s { min-width: 0; }

  .note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 80ch; }

  @media (max-width: 820px) {
    .lower { grid-template-columns: minmax(0, 1fr); }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ball, .chip { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back" id="back" href="/">← アプリに戻る</a>
    <p class="backmsg" id="backmsg" hidden>ブラウザが、このタブを閉じられませんでした。このタブを閉じて、アプリのタブに戻ってください。</p>
    <h1>リクエストの旅</h1>
    <p class="lead">部品検索アプリで 1 回の API 呼び出しが、ブラウザから DB まで往復する道を、ボールで追います。止まった場所で、実際のファイルと行が分かります。</p>
  </header>

  <div class="bar">
    <div class="group" role="tablist" aria-label="追う操作" id="tabs"></div>
    <div class="group seg" role="group" aria-label="動かしている場所">
      <span class="lbl">環境</span>
      <button type="button" id="env-prod" aria-pressed="true">本番</button>
      <button type="button" id="env-local" aria-pressed="false">ローカル</button>
    </div>
  </div>

  <div class="scroller" id="scroller">
    <div class="board" id="board">
      <svg class="lanes" id="lanes" viewBox="0 0 810 330" aria-hidden="true">
        <defs>
          <marker id="ah-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" style="fill:var(--req)"/></marker>
          <marker id="ah-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" style="fill:var(--res)"/></marker>
        </defs>
      </svg>
      <div class="chip" id="chip"></div>
      <div class="ball req" id="ball"></div>
    </div>
  </div>

  <div class="bar">
    <div class="group tp">
      <button type="button" id="prev" aria-label="1 つ前のステップ">◀ 戻る</button>
      <button type="button" id="play" class="primary">一時停止</button>
      <button type="button" id="next" aria-label="1 つ先のステップ">進む ▶</button>
      <select id="speed" aria-label="再生の速さ">
        <option value="0.5">0.5 倍速</option>
        <option value="1" selected>1 倍速</option>
        <option value="2">2 倍速</option>
      </select>
    </div>
    <div class="scrub" style="flex:1; min-width: 220px;">
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="ステップの位置">
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="lower">
    <section class="detail" id="detail" aria-live="polite"></section>
    <div class="stepsbox">
      <h3>この操作の全ステップ</h3>
      <ol class="steps" id="steps"></ol>
    </div>
  </div>

  <p class="note">ボールは、上の線(青)で依頼を運び、下の線(緑)で結果を持ち帰ります。スペースで再生と一時停止を切り替えられます。</p>
</div>

/* ステップの組み立て */
function build(sc, env) {
  const prod = env === 'prod';
  const k = sc.id;
  const steps = [];
  const add = (o) => steps.push(o);
  const reqMsg = `${sc.method} ${sc.url}`;

  add({ s: 0, lane: 'req', title: sc.trigger.title, text: sc.trigger.text, snip: `${k}.trig`, msg: null });
  if (sc.caller) add({ s: 0, lane: 'req', title: sc.caller.title, text: sc.caller.text, snip: `${k}.caller`, msg: null });
  add({ s: 0, lane: 'req', title: 'fetch() で依頼を出す',
    text: `api.ts の \`${sc.fn}()\` が \`fetch()\` を呼びます。URL は \`/api/…\` だけで、ドメインは書きません(本番でも開発中でも、同じ形にするためです)。`,
    snip: `${k}.fetch`, msg: reqMsg, dir: 'req' });
  add({ s: 1, lane: 'req', title: prod ? 'Vercel が backend に回す' : 'Vite が FastAPI に転送する',
    text: prod
      ? 'URL が `/api/` で始まるので、`vercel.json` の `rewrites` が、依頼を FastAPI(backend)に渡します。それ以外の URL は、画面(frontend)に渡します。'
      : '開発中は、Vite の開発サーバーが、`/api` で始まる依頼を `http://127.0.0.1:8000`(uvicorn で動かす FastAPI)に転送します。',
    snip: prod ? 'common.edge.prod' : 'common.edge.local', msg: reqMsg, dir: 'req' });
  add({ s: 2, lane: 'req', title: 'FastAPI がルートを見つける',
    text: '`@app.get(…)` に書いた URL の形と照合して、合う関数を呼びます。' + (sc.param ? '`{…}` の部分は、型(`int`)に合わせて数値にして、引数として渡します(数字にできなければ 422 を返します)。' : ''),
    snip: `${k}.route`, msg: `→ ${sc.call}`, dir: 'req' });
  add({ s: 2, lane: 'req', title: 'DB に接続する',
    text: '`with get_cursor()` が、リクエストごとに DB へ接続します(サーバーレスでは、接続を持ち越せないためです)。接続先は環境変数 `DATABASE_URL` で、本番は Neon、ローカルは自分の PostgreSQL です。',
    snip: 'common.cursor', msg: 'DATABASE_URL に接続', dir: 'req' });

  const n = sc.queries.length;
  sc.queries.forEach((q, i) => {
    const sq = `${k}.q${i + 1}`;
    add({ s: 3, lane: 'req', title: `SQL ${i + 1}/${n}: ${q.title}`, text: q.send, snip: sq, msg: q.sqlMsg, dir: 'req' });
    add({ s: 3, lane: 'res', title: `DB が ${q.table} を読む`, text: q.db + ' テーブルの定義は `schema.sql` にあります。', snip: `t.${q.table}`, msg: q.rows, dir: 'res', file: 'schema' });
    add({ s: 2, lane: 'res', title: '行が Python に戻る', text: q.back, snip: sq + 'b', msg: q.rows, dir: 'res' });
    if (i < n - 1) {
      add({ s: 2, lane: 'req', title: '次の SQL へ', text: `このリクエストは SQL を ${n} 回使います。結果を受け取ったので、次の SQL を送ります。`, snip: `${k}.q${i + 2}`, msg: '', dir: 'req' });
    }
  });

  add({ s: 2, lane: 'res', title: 'JSON にして返す', text: sc.retText + ' 返す形に合わない項目は、落とされます。', snip: `${k}.ret`, msg: '200 OK  ' + sc.resp, dir: 'res' });
  add({ s: 1, lane: 'res', title: prod ? 'Vercel がそのまま返す' : 'Vite がそのまま返す',
    text: 'レスポンスは、来た道を逆に戻ります。内容は、そのままです。',
    snip: prod ? 'common.edge.prod' : 'common.edge.local', msg: '200 OK  application/json', dir: 'res' });
  add({ s: 0, lane: 'res', title: 'レスポンスを受け取る',
    text: '`response.ok` で 200 台かを確かめ、`response.json()` で JSON を JavaScript の値にします。失敗したときは、画面に出すエラーを投げます。' + sc.clientNote,
    snip: `${k}.client`, msg: '200 OK', dir: 'res' });
  add({ s: 0, lane: 'res', title: '画面が更新される', text: sc.render.text, snip: `${k}.render`, msg: '画面に表示', dir: 'res' });
  return steps;
}

/* 画面の部品 */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const rich = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const base = (p) => p.split('/').pop();
const pct = (v, total) => (v / total * 100) + '%';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let sci = 0, env = 'prod', idx = 0, playing = !reduced, speed = 1, steps = [], timer = null;
const MOVE = 800, DWELL = 2800;

function drawBoard() {
  const board = $('board');
  board.querySelectorAll('.station,.glabel').forEach((e) => e.remove());
  const st = stations(env);
  st.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'station';
    d.id = 'st' + i;
    d.style.cssText = `left:${pct(CX[i] - BW / 2, W)};top:${pct(70, H)};width:${pct(BW, W)};height:${pct(230, H)};--c:${COLORS[i]}`;
    d.innerHTML = `${ICONS[i]}<div class="name">${esc(s.name)}</div><div class="role">${esc(s.role)}</div><div class="file">${esc(s.file)}</div>`;
    board.insertBefore(d, $('chip'));
  });
  const q = ['HTTP', '転送', 'SQL'], r = ['200 · JSON', 'JSON', '行(rows)'];
  for (let i = 0; i < 3; i++) {
    const mid = (CX[i] + CX[i + 1]) / 2;
    [[q[i], YQ - 22, 'q'], [r[i], YS + 8, 'r']].forEach(([t, y, c]) => {
      const l = document.createElement('div');
      l.className = 'glabel ' + c;
      l.style.cssText = `left:${pct(mid, W)};top:${pct(y, H)}`;
      l.textContent = t;
      board.insertBefore(l, $('chip'));
    });
  }
}

function drawLanes() {
  const svg = $('lanes');
  svg.querySelectorAll('line').forEach((e) => e.remove());
  for (let i = 0; i < 3; i++) {
    const a = CX[i] + BW / 2, b = CX[i + 1] - BW / 2;
    svg.insertAdjacentHTML('beforeend',
      `<line x1="${a}" y1="${YQ}" x2="${b - 2}" y2="${YQ}" stroke-width="2" marker-end="url(#ah-req)" style="stroke:var(--req)"/>` +
      `<line x1="${b}" y1="${YS}" x2="${a + 2}" y2="${YS}" stroke-width="2" marker-end="url(#ah-res)" style="stroke:var(--res)"/>`);
  }
}

function drawTabs() {
  $('tabs').innerHTML = SC.map((s, i) =>
    `<button type="button" role="tab" class="chipbtn" aria-selected="${i === sci}" data-i="${i}">${esc(s.tab)}</button>`).join('');
}

function codeHtml(sn) {
  return sn.segs.map((seg, si) => {
    const rows = seg.lines.map((t, j) => {
      const no = seg.from + j;
      return `<div class="row${no === sn.hl ? ' hl' : ''}"><span class="ln">${no}</span><span>${esc(t)}</span></div>`;
    }).join('');
    return (si ? '<div class="sep">⋯</div>' : '') + rows;
  }).join('');
}

function render() {
  const sc = SC[sci], s = steps[idx], sn = SN[s.snip];
  const x = CX[s.s], y = s.lane === 'req' ? YQ : YS;
  const board = $('board'), ball = $('ball'), chip = $('chip');

  board.style.setProperty('--move', (MOVE / speed) + 'ms');
  ball.style.left = pct(x, W);
  ball.style.top = pct(y, H);
  ball.className = 'ball ' + s.lane;
  document.querySelectorAll('.station').forEach((e, i) => e.classList.toggle('on', i === s.s));

  const stName = stations(env)[s.s].name;
  const where = `${base(sn.file)}:${sn.hl}`;
  chip.innerHTML = `<span class="f">${esc(where)}</span><span class="t">${esc(s.title)}</span>` + (s.msg ? `<span class="m">${esc(s.msg)}</span>` : '');
  const bw = board.offsetWidth, bx = x / W * bw, cw = chip.offsetWidth;
  const left = Math.max(4, Math.min(bx - cw / 2, bw - cw - 4));
  chip.style.left = left + 'px';
  chip.style.setProperty('--ax', Math.max(12, Math.min(bx - left, cw - 12)) + 'px');

  const segs = sn.segs.map((g) => g.lines.length > 1 ? `${g.from}-${g.from + g.lines.length - 1}` : `${g.from}`).join(', ');
  $('detail').innerHTML =
    `<div class="eyebrow" style="--c:${COLORS[s.s]}"><span class="dot"></span><span>ステップ ${idx + 1} / ${steps.length} ・ ${esc(stName)}</span></div>` +
    `<h2>${esc(s.title)}</h2><p>${rich(s.text)}</p>` +
    `<div class="where">${esc(sn.file)} : ${esc(segs)}</div>` +
    `<div class="code" tabindex="0" role="region" aria-label="コード">${codeHtml(sn)}</div>` +
    (s.msg ? `<div class="msg"><span class="k">${s.dir === 'res' ? '運んでいるもの(結果)' : '運んでいるもの(依頼)'}</span><span class="v ${s.dir || ''}">${esc(s.msg)}</span></div>` : '');

  const list = $('steps');
  list.querySelectorAll('li').forEach((li, i) => li.classList.toggle('on', i === idx));
  const cur = list.children[idx];
  if (cur) {
    const t = cur.offsetTop, b = t + cur.offsetHeight;
    if (t < list.scrollTop || b > list.scrollTop + list.clientHeight) list.scrollTop = Math.max(0, t - list.clientHeight / 2);
  }
  $('scrub').value = idx;
  $('count').textContent = `${idx + 1} / ${steps.length}`;
  $('play').textContent = playing ? '一時停止' : (idx >= steps.length - 1 ? 'もう一度' : '再生');

  const sc2 = $('scroller');
  if (sc2.scrollWidth > sc2.clientWidth) sc2.scrollTo({ left: Math.max(0, bx - sc2.clientWidth / 2), behavior: reduced ? 'auto' : 'smooth' });
}

function drawSteps() {
  $('steps').innerHTML = steps.map((s, i) =>
    `<li style="--c:${COLORS[s.s]}"><button type="button" data-i="${i}"><span class="n">${i + 1}</span><span class="s">${esc(s.title)}</span></button></li>`).join('');
  $('scrub').max = steps.length - 1;
}

function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  timer = setTimeout(() => {
    if (idx < steps.length - 1) { idx++; render(); schedule(); }
    else { playing = false; render(); }
  }, (MOVE + DWELL) / speed);
}

function go(i, keepPlaying) {
  idx = Math.max(0, Math.min(steps.length - 1, i));
  if (!keepPlaying) playing = false;
  render();
  schedule();
}

function load() {
  steps = build(SC[sci], env);
  idx = 0;
  drawTabs(); drawBoard(); drawSteps();
  $('env-prod').setAttribute('aria-pressed', env === 'prod');
  $('env-local').setAttribute('aria-pressed', env === 'local');
  render(); schedule();
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  sci = +b.dataset.i; playing = !reduced; load();
});
$('env-prod').addEventListener('click', () => { env = 'prod'; load(); });
$('env-local').addEventListener('click', () => { env = 'local'; load(); });
$('steps').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) go(+b.dataset.i); });
$('prev').addEventListener('click', () => go(idx - 1));
$('next').addEventListener('click', () => go(idx + 1));
$('scrub').addEventListener('input', (e) => go(+e.target.value));
$('speed').addEventListener('change', (e) => { speed = +e.target.value; render(); schedule(); });
$('play').addEventListener('click', () => {
  if (playing) { playing = false; render(); clearTimeout(timer); return; }
  if (idx >= steps.length - 1) idx = 0;
  playing = true; render(); schedule();
});
document.addEventListener('keydown', (e) => {
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
  else if (e.key === ' ' && t !== 'BUTTON') { e.preventDefault(); $('play').click(); }
});
addEventListener('resize', render);

// 「アプリに戻る」: アプリのリンクから開かれたときは、このタブを閉じて元のタブに戻る
// (リンクで移ると、アプリのタブが増えていくため)。直接開いたときは、普通のリンクとして動く。
// 「アプリから開かれたか」は、参照元(document.referrer)が同じサイトかで見分ける。
// target="_blank" のリンクは、標準で window.opener を渡さない(noopener)ので、opener は使えない
const openedFromApp = (() => {
  try { return !!document.referrer && new URL(document.referrer).origin === location.origin; } catch { return false; }
})();
const back = $('back');
if (back) {
  back.addEventListener('click', (e) => {
    if (!openedFromApp) return;
    e.preventDefault();
    window.close();
    setTimeout(() => { $('backmsg').hidden = false; }, 300);
  });
}

drawLanes();
load();
</script>
